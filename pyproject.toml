[build-system]
requires = ["hatchling>=1.24,<2"]
build-backend = "hatchling.build"

[project]
name = "etf-quant"
version = "0.1.0"
description = "PIT-first data foundation for an A-share ETF medium/low-frequency quant system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "akshare>=1.18,<2",
  "duckdb>=1.0,<2",
  "longbridge>=4.0,<5",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "pyarrow>=15,<24",
  "PyYAML>=6,<7",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/etf_quant"]

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
testpaths = ["tests"]
markers = [
  "integration: calls a real external provider and requires network/credentials as applicable",
]
